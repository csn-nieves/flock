<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#369F60" />
    <meta
      name="description"
      content="Flock helps run clubs organize group runs and keep members connected."
    />
    <link rel="icon" href="/icons/flock-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Flock</title>
    <script>
      try {
        const preference = localStorage.getItem('flock.theme') || 'system'
        const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme =
          preference === 'system' ? (dark ? 'dark' : 'light') : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
